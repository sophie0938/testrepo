<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
        <h1>問い合わせフォーム</h1>
        <form action="#" method="post">
            <d1>
                <dt>氏名</dt>
                <dd>
                    <input type="text" name="name" value="あなたの名前">
                </dd>
                <dt>パスワード</dt>
                <dd>
                    <input type="password" name="password" placeholder="パスワード">
                </dd>
                <dt>メールアドレス</dt>
                <dd>
                    <input type="email" name="email" placeholder="メールアドレス">
                </dd>
                <dt>転職回数</dt>
                <dd>
                    <input type="number" min="1" max="10" name="number" placeholder="回数">
                </dd>
                <dt>ポートフォリオサイトリンク</dt>
                <dt>
                    <input type="url" name="url" placeholder="url">
                </dt>
                <dt>性別</dt>
                <dt>
                    <input type="radio" name="gender" value="male">男性
                    <input type="radio" name="gender" value="female">女性
                </dt>
                <dt>IT業界での経験があれば☑️を入れてください</dt>
                <dd>
                    <input type="checkbox" name="experience" value="1">
                </dd>
                <dt>希望職種</dt>
                <dd>
                    <select name="jop">
                        <option value="choice">未選択</option>
                        <option value="engineer">エンジニア</option>
                        <option value="sales">営業</option>
                        <option value="icinsultant">コンサルタント</option>
                    </select>
                </dd>
                <dt>自由記入</dt>
                <dd>
                    <textarea name="free" cols="30" rows="10"></textarea>
                </dd>
            </d1>
            <input type="submit" value="登録">
        </form>
        
</body>
</html>
